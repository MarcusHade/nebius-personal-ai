<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Assistant</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --card:#f3f4f6; --me:#dbeafe; --line:#d8dbe0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa0a6; --card:#1c2128; --me:#1e3a5f; --line:#2d333b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  header small { color:var(--muted); font-weight:400; margin-left:8px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:760px; padding:10px 14px; border-radius:12px; background:var(--card); white-space:pre-wrap; }
  .msg.me { background:var(--me); align-self:flex-end; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:10px 18px; border-radius:8px; border:0; background:#2563eb; color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>Inbox Assistant <small id="status">connecting…</small></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="What came in today that I should care about?" autocomplete="off" autofocus><button id="go">Send</button></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), go = document.getElementById('go');
let sid = null;
function add(text, cls, meta) {
  const d = document.createElement('div'); d.className = 'msg ' + (cls || ''); d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
fetch('/health').then(r => r.json()).then(h => {
  document.getElementById('status').textContent = `${h.model} · ${h.tools.length} tools · ${h.memory_items} memories`;
}).catch(() => { document.getElementById('status').textContent = 'backend unreachable'; });
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const message = q.value.trim(); if (!message) return;
  q.value = ''; go.disabled = true; add(message, 'me');
  const wait = add('…');
  try {
    const r = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message, session_id: sid }) });
    const j = await r.json();
    wait.remove();
    if (!r.ok) { add('Error: ' + (j.detail || r.status)); }
    else { sid = j.session_id; add(j.answer, '', `tools: ${j.tool_calls.join(', ') || 'none'} · memory hits: ${j.memory_hits}`); }
  } catch (err) { wait.remove(); add('Network error: ' + err); }
  go.disabled = false; q.focus();
});
</script>
</body>
</html>
